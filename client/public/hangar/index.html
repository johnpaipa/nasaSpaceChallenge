  telEl.textContent=transit&&landed?"Aterrizaje en "+M0.at+" · 0.0 km/s":transit&&arrived&&vy<1?"Llegada a "+M0.at+" · 0.0 km/s":transit?"Distancia a "+M0.at+": "+Math.round(Math.max(0,tdist-M0.R-350)/(D0-M0.R-350)*M0.km).toLocaleString("es")+" km · "+(vy*.025).toFixed(1)+" km/s":"Altitud "+(fy*.04).toFixed(1)+" km · "+(vy*.035).toFixed(2)+" km/s · "+LAYERS[layerIdx]}
 if(window.workshopTick)window.workshopTick();
 renderer.render(scene,cam)}
resize();loop();
buildMenu();
/* ===== Puente con la página anfitriona (postMessage) =====
   Permite que un padre (iframe) elija la misión real sin tocar el resto del
   archivo: se queda usable de forma independiente si nadie manda mensajes. */
window.addEventListener("message",function(ev){
 var d=ev&&ev.data;if(!d||d.type!=="hangar:start")return;
 try{if(!localStorage.getItem("smd-hangar-voice-lang")&&d.lang)voiceLang=d.lang==="en"?"en":"es"}catch(e){}
 var idx=(typeof d.missionIndex==="number"&&MS[d.missionIndex])?d.missionIndex:0;
 if(d.orbitName)MS[idx].name=d.orbitName;
 if(d.payloadDesc)MS[idx].payFn=d.payloadDesc;
 if(d.orbitKind)orbitKind=d.orbitKind;
 missionOutcome=d.outcome||"success";
 var ok=missionOutcome==="success"||missionOutcome==="lost";
 if(d.needsBurn&&ok)MS[idx].meta="10 fases · Media";
 selectMission(idx);
 /* Falla real, ya decidida por el motor de simulación (shared/engine.js)
    según las decisiones del jugador en el Diseñador/Hangar: aquí solo se
    dramatiza, truncando el control de misión en el punto correcto en vez
    de inventar un sistema de errores aparte que cambiaría el resultado. */
 if(missionOutcome==="cancelled"){L.length=0}
 else if(missionOutcome==="launch_fail"){L.length=Math.min(L.length,3)}
 else if(missionOutcome==="orbit_fail"){L.length=Math.min(L.length,8)}
 /* Órbitas altas/lejanas (GEO, L1) necesitan un segundo encendido para
    circularizar: se agrega como una fase más del control de misión, igual
    que el motor real necesita ese empuje extra (mismo criterio que usa
    shared/engine.js para orbit_fail: requires_propulsion_level). No toca
    la física de ascenso, solo añade una pregunta más antes de "Carga útil". */
 else if(d.needsBurn){
  L.splice(L.length-1,0,{q:"Llegamos a la órbita de transferencia. Para quedar en "+MS[idx].name+" hace falta un quemado más. ¿Qué hacemos?",ok:"Hacer el quemado de circularización",hint:"Sin un segundo encendido del motor la nave se queda en la órbita de transferencia.",fact:"El motor se reenciende para circularizar y quedar establemente en "+MS[idx].name+".",dur:2600,go:function(){fx("Quemado de circularización",2600)}});
  var tg=TAGS.slice();tg.push("Circularización");tg.push("Carga útil");tlEl.innerHTML=tg.map(function(t){return "<li>"+t+"</li>"}).join("");
 }
});
try{window.parent.postMessage({type:"hangar:ready"},"*")}catch(e){}
</script>
